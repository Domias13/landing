<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="7-дневная программа трансформации. Почувствуй облегчение уже в первый день." />
  <meta property="og:title" content="Как перестать думать о бывшем за 7 дней" />
  <meta property="og:description" content="7-дневная программа трансформации. Почувствуй облегчение уже в первый день." />
  <meta property="og:type" content="website" />
  <title>Как перестать думать о бывшем за 7 дней</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #0e0b1a;
  --bg-2: #161229;
  --surface: #1c1733;
  --surface-2: #241d3e;
  --border: rgba(255, 220, 200, 0.08);
  --text: #f1e6dd;
  --muted: #a89bb0;
  --accent: #f3a866;
  --accent-2: #e9806a;
  --rose: #d6859a;
  --indigo: #5a4ea3;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --radius: 14px;
  --maxw: 1100px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.55;
  scroll-behavior: smooth;
}

img { max-width: 100%; display: block; }

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 20px;
}
.container.narrow { max-width: 760px; }
.container.center, .center { text-align: center; }

/* Header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(12px);
  background: rgba(14, 11, 26, 0.72);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  padding-bottom: 14px;
}
.brand {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text);
}
.lang-toggle {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px;
  gap: 2px;
}
.lang-btn {
  background: transparent;
  border: 0;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all .2s ease;
}
.lang-btn.active {
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  color: #1a1226;
}

/* Hero */
.hero {
  position: relative;
  overflow: hidden;
  padding: 80px 0 100px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 0%, rgba(243, 168, 102, 0.18), transparent 55%),
    radial-gradient(circle at 80% 30%, rgba(214, 133, 154, 0.18), transparent 55%),
    radial-gradient(circle at 50% 90%, rgba(90, 78, 163, 0.25), transparent 60%);
  pointer-events: none;
  animation: drift 18s ease-in-out infinite alternate;
}
@keyframes drift {
  0% { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-20px,10px,0) scale(1.05); }
}
.hero-inner {
  position: relative;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.badge {
  display: inline-block;
  padding: 8px 18px;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.3px;
  background: rgba(243, 168, 102, 0.06);
}
.hero-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(36px, 6vw, 64px);
  line-height: 1.05;
  margin: 0;
  max-width: 900px;
  background: linear-gradient(180deg, #fff5ec, #d8c1b3);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-promise {
  font-size: clamp(17px, 2.2vw, 21px);
  color: var(--muted);
  max-width: 640px;
  margin: 0;
}
.hero-note {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0;
}

/* CTA */
.cta-primary {
  display: inline-block;
  padding: 16px 32px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 16px;
  color: #1a1226;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(243, 168, 102, 0.25), 0 2px 0 rgba(0,0,0,0.1);
  transition: transform .15s ease, box-shadow .2s ease;
}
.cta-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(243, 168, 102, 0.35); }
.cta-primary:active { transform: translateY(0); }
.cta-primary.big { padding: 18px 38px; font-size: 17px; }

/* Sections */
.section { padding: 80px 0; }
.section-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.15;
  margin: 0 0 28px;
  color: #fff3e8;
  text-align: center;
}
.section-title.small { font-size: clamp(22px, 3vw, 32px); }
.lead {
  font-size: 18px;
  color: var(--muted);
  text-align: center;
  max-width: 640px;
  margin: 0 auto;
}
.muted { color: var(--muted); text-align: center; margin: 0 0 24px; }

/* Pains */
.pains-list, .desires-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 12px;
}
.pains-list li, .desires-list li {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  font-size: 16px;
  color: var(--text);
  position: relative;
  padding-left: 46px;
}
.pains-list li::before {
  content: '';
  position: absolute;
  left: 18px;
  top: 50%;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--rose);
  transform: translateY(-50%);
  box-shadow: 0 0 0 4px rgba(214, 133, 154, 0.18);
}
.desires-list li::before {
  content: '';
  position: absolute;
  left: 16px;
  top: 50%;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateY(-50%);
  box-shadow: 0 0 0 4px rgba(243, 168, 102, 0.18);
}

/* Triggers */
.triggers .lead { font-size: 19px; line-height: 1.6; color: var(--text); opacity: 0.9; }

/* Program */
.days-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.day-card {
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform .25s ease, border-color .25s ease;
}
.day-card:hover { transform: translateY(-4px); border-color: rgba(243, 168, 102, 0.35); }
.day-card .day-num {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.day-card .day-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  margin: 4px 0 6px;
  color: #fff3e8;
}
.day-card .day-desc { color: var(--muted); font-size: 15px; margin: 0; }
.day-card.day-1 {
  border-color: rgba(243, 168, 102, 0.4);
  background: linear-gradient(180deg, rgba(243, 168, 102, 0.08), var(--surface-2));
}

/* Why */
.why-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}
.why-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.why-card h3 {
  font-family: var(--serif);
  font-size: 22px;
  margin: 0 0 8px;
  color: #fff3e8;
}
.why-card p { color: var(--muted); margin: 0; font-size: 15px; }

/* Testimonials */
.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}
.testimonial {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.testimonial .quote {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.5;
  color: var(--text);
  margin: 0;
  font-style: italic;
}
.testimonial .author {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 14px;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--rose));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #1a1226;
  font-weight: 700;
  font-family: var(--serif);
  font-size: 18px;
}

/* Pricing */
.pricing-card {
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid rgba(243, 168, 102, 0.3);
  border-radius: 22px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.4);
}
.price {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(56px, 8vw, 84px);
  line-height: 1;
  margin: 18px 0 6px;
  background: linear-gradient(180deg, var(--accent), var(--rose));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.price-compare {
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.pricing-includes {
  list-style: none;
  padding: 0;
  margin: 0 0 28px;
  text-align: left;
  display: grid;
  gap: 10px;
}
.pricing-includes li {
  padding: 10px 14px 10px 36px;
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  position: relative;
  color: var(--text);
  font-size: 15px;
}
.pricing-includes li::before {
  content: '';
  position: absolute;
  left: 12px;
  top: 50%;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  transform: translateY(-50%);
}

/* Guarantee */
.guarantee-title {
  font-family: var(--serif);
  font-size: 28px;
  margin: 0 0 12px;
  color: var(--accent);
}

/* FAQ */
.faq-list { display: grid; gap: 10px; }
.faq-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.faq-q {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  cursor: pointer;
}
.faq-q::after {
  content: '+';
  font-size: 22px;
  color: var(--accent);
  transition: transform .2s ease;
}
.faq-item.open .faq-q::after { transform: rotate(45deg); }
.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease, padding .3s ease;
  padding: 0 22px;
  color: var(--muted);
}
.faq-item.open .faq-a {
  max-height: 400px;
  padding: 0 22px 18px;
}

/* Final */
.final-cta { padding: 100px 0 120px; }

/* Footer */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 24px 0;
  background: var(--bg-2);
}
.footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 14px;
  flex-wrap: wrap;
  gap: 12px;
}
.footer-price { color: var(--accent); font-weight: 600; }

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeIn .2s ease;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
  max-width: 440px;
  text-align: center;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  animation: rise .25s ease;
}
.modal h3 {
  font-family: var(--serif);
  font-size: 24px;
  margin: 0 0 12px;
  color: #fff3e8;
}
.modal p { color: var(--muted); margin: 0 0 24px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* Reveal animations */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

/* Mobile */
@media (max-width: 640px) {
  .hero { padding: 56px 0 70px; }
  .section { padding: 56px 0; }
  .pricing-card { padding: 32px 22px; }
  .footer-inner { justify-content: center; text-align: center; }
}

</style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">7 Days</div>
      <div class="lang-toggle" role="group" aria-label="Language toggle">
        <button data-lang="ru" class="lang-btn active" type="button">RU</button>
        <button data-lang="uk" class="lang-btn" type="button">UA</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="container hero-inner">
        <div class="badge" data-i18n="heroSubtitle"></div>
        <h1 class="hero-title" data-i18n="heroTitle"></h1>
        <p class="hero-promise" data-i18n="heroPromise"></p>
        <button class="cta-primary" data-cta data-i18n="heroCta"></button>
        <p class="hero-note" data-i18n="heroGuarantee"></p>
      </div>
    </section>

    <section class="section pains reveal">
      <div class="container narrow">
        <h2 class="section-title" data-i18n="painsTitle"></h2>
        <ul class="pains-list" id="pains-list"></ul>
      </div>
    </section>

    <section class="section triggers reveal">
      <div class="container narrow">
        <h2 class="section-title small" data-i18n="triggersTitle"></h2>
        <p class="lead" data-i18n="triggersText"></p>
      </div>
    </section>

    <section class="section program reveal">
      <div class="container">
        <h2 class="section-title" data-i18n="programTitle"></h2>
        <div class="days-grid" id="days-grid"></div>
      </div>
    </section>

    <section class="section desires reveal">
      <div class="container narrow">
        <h2 class="section-title" data-i18n="desiresTitle"></h2>
        <ul class="desires-list" id="desires-list"></ul>
      </div>
    </section>

    <section class="section why reveal">
      <div class="container">
        <h2 class="section-title" data-i18n="whyItWorksTitle"></h2>
        <div class="why-grid" id="why-grid"></div>
      </div>
    </section>

    <section class="section testimonials reveal">
      <div class="container">
        <h2 class="section-title" data-i18n="testimonialsTitle"></h2>
        <div class="testimonials-grid" id="testimonials-grid"></div>
      </div>
    </section>

    <section class="section pricing reveal">
      <div class="container narrow">
        <div class="pricing-card">
          <h2 class="section-title" data-i18n="pricingTitle"></h2>
          <p class="muted" data-i18n="pricingSubtitle"></p>
          <div class="price" data-i18n="pricingPrice"></div>
          <div class="price-compare" data-i18n="pricingComparison"></div>
          <ul class="pricing-includes" id="pricing-includes"></ul>
          <button class="cta-primary big" data-cta data-i18n="pricingCta"></button>
        </div>
      </div>
    </section>

    <section class="section guarantee reveal">
      <div class="container narrow center">
        <h3 class="guarantee-title" data-i18n="guaranteeTitle"></h3>
        <p class="lead" data-i18n="guaranteeText"></p>
      </div>
    </section>

    <section class="section faq reveal">
      <div class="container narrow">
        <h2 class="section-title" data-i18n="faqTitle"></h2>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>

    <section class="section final-cta reveal">
      <div class="container narrow center">
        <h2 class="section-title" data-i18n="finalCtaTitle"></h2>
        <p class="lead" data-i18n="finalCtaSubtitle"></p>
        <button class="cta-primary big" data-cta data-i18n="finalCtaButton"></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-i18n="footerCopyright"></span>
      <span class="footer-price" data-i18n="price"></span>
    </div>
  </footer>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h3 data-i18n="modalWaitlistTitle"></h3>
      <p data-i18n="modalWaitlistDesc"></p>
      <button class="cta-primary" id="modal-close" data-i18n="modalWaitlistClose"></button>
    </div>
  </div>

  <script>
/* ----------------------------- i18n dictionary ----------------------------- */
const i18n = {

    documentTitle: "Как перестать думать о бывшем за 7 дней",

    programTitle: "Что внутри 7-дневной программы",
    programDays: [
      { day: "День 1", title: "Остановка кровотечения", desc: "Экстренные техники, чтобы мгновенно снизить тревогу и уснуть сегодня ночью." },

      { day: "День 6", title: "Пересборка идентичности", desc: "Вспоминаем, кто ты без него. Твои желания, твоя жизнь." },
      { day: "День 7", title: "Свобода", desc: "Ты просыпаешься и понимаешь, что он больше не первая мысль в твоей голове." }
    ],

    desiresTitle: "Представь, что через неделю ты сможешь...",
    desiresList: [
      "Проснуться утром и понять, что не вспомнила о нем",

/* ----------------------------- State ----------------------------- */
let currentLocale = "ru";

/* ------------------------ Geolocation by IP ---------------------- */
async function detectCountry() {
  // user override wins
  const saved = localStorage.getItem("locale");
  if (saved === "ru" || saved === "uk") return saved;

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);
    const res = await fetch("https://ipapi.co/json/", { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) return "ru";
    const data = await res.json();
    return data && data.country_code === "UA" ? "uk" : "ru";
  } catch (e) {
    return "ru";
  }
}

/* ----------------------------- Render ---------------------------- */
function setText(selector, text) {
  document.querySelectorAll(selector).forEach((el) => (el.textContent = text));
}

function renderList(container, items, builder) {
  container.innerHTML = "";
  items.forEach((item, i) => {
    const node = builder(item, i);
    container.appendChild(node);
  });
}

function applyLocale(locale) {
  currentLocale = locale;
  const t = i18n[locale];

  document.documentElement.lang = locale === "uk" ? "uk" : "ru";
  document.title = t.documentTitle;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", t.documentDesc);

  // Simple text bindings
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (typeof t[key] === "string") el.textContent = t[key];
  });

  // Pains list
  const pains = document.getElementById("pains-list");
  renderList(pains, t.painsList, (text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  });

  // Desires list
  const desires = document.getElementById("desires-list");
  renderList(desires, t.desiresList, (text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  });

  // Days
  const days = document.getElementById("days-grid");
  renderList(days, t.programDays, (d, i) => {
    const card = document.createElement("div");
    card.className = "day-card" + (i === 0 ? " day-1" : "");
    card.innerHTML =
      `<div class="day-num">${escapeHtml(d.day)}</div>` +
      `<div class="day-title">${escapeHtml(d.title)}</div>` +
      `<p class="day-desc">${escapeHtml(d.desc)}</p>`;
    return card;
  });

  // Why it works
  const why = document.getElementById("why-grid");
  renderList(why, t.whyItWorksList, (item) => {
    const card = document.createElement("div");
    card.className = "why-card";
    card.innerHTML =
      `<h3>${escapeHtml(item.title)}</h3>` +
      `<p>${escapeHtml(item.desc)}</p>`;
    return card;
  });

  // Testimonials
  const tg = document.getElementById("testimonials-grid");
  renderList(tg, t.testimonials, (t2) => {
    const card = document.createElement("div");
    card.className = "testimonial";
    const initial = (t2.name || "?").trim().charAt(0);
    card.innerHTML =
      `<p class="quote">«${escapeHtml(t2.text)}»</p>` +
      `<div class="author"><span class="avatar">${escapeHtml(initial)}</span><span>${escapeHtml(t2.name)}, ${t2.age}</span></div>`;
    return card;
  });

  // Pricing includes
  const inc = document.getElementById("pricing-includes");
  renderList(inc, t.pricingIncludes, (text) => {
    const li = document.createElement("li");
    li.textContent = text;
    return li;
  });

  // FAQ
  const faqList = document.getElementById("faq-list");
  faqList.innerHTML = "";
  t.faqs.forEach((f) => {
    const item = document.createElement("div");
    item.className = "faq-item";
    const btn = document.createElement("button");
    btn.className = "faq-q";
    btn.type = "button";
    btn.textContent = f.q;
    const a = document.createElement("div");
    a.className = "faq-a";
    const p = document.createElement("p");
    p.textContent = f.a;
    p.style.padding = "0 0 4px";
    a.appendChild(p);
    btn.addEventListener("click", () => item.classList.toggle("open"));
    item.appendChild(btn);
    item.appendChild(a);
    faqList.appendChild(item);
  });

  // Language toggle active state
  document.querySelectorAll(".lang-btn").forEach((b) => {
    b.classList.toggle("active", b.getAttribute("data-lang") === locale);
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ----------------------------- Modal ----------------------------- */
function openModal() {
  const m = document.getElementById("modal");
  m.hidden = false;
  document.body.style.overflow = "hidden";
}
function closeModal() {
  const m = document.getElementById("modal");
  m.hidden = true;
  document.body.style.overflow = "";
}

/* --------------------------- Reveal on scroll -------------------- */
function setupReveal() {
  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) {
    els.forEach((el) => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      });
    },
    { threshold: 0.12 }
  );
  els.forEach((el) => io.observe(el));
}

/* ----------------------------- Init ----------------------------- */
async function init() {
  // initial best-effort locale, then refine after IP lookup
  applyLocale("ru");

  // language toggle clicks
  document.querySelectorAll(".lang-btn").forEach((b) => {
    b.addEventListener("click", () => {
      const lang = b.getAttribute("data-lang");
      localStorage.setItem("locale", lang);
      applyLocale(lang);
    });
  });

  // CTA buttons → modal
  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-cta]");
    if (target) {
      e.preventDefault();
      openModal();
    }
  });

  // modal close
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  setupReveal();

  const detected = await detectCountry();
  if (detected !== currentLocale) applyLocale(detected);
}

document.addEventListener("DOMContentLoaded", init);
